<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Web Programmer &amp; GIS Developer</title>
    <meta name="description" content="Portfolio seorang Web Programmer & GIS Developer berpengalaman sejak 2017. Spesialis aplikasi pemerintahan, sistem pajak daerah, dan WebGIS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        code, .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::selection { background-color: #2dd4bf; color: #0f172a; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #2dd4bf; }

        .hero-gradient {
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(45,212,191,0.12) 0%, transparent 70%);
        }

        /* ── Language toggle ── */
        .lang-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 999px;
            border: 1px solid #334155;
            font-size: 12px; font-family: 'JetBrains Mono', monospace;
            font-weight: 600; letter-spacing: 0.05em;
            cursor: pointer; transition: all 0.2s;
            color: #94a3b8; background: transparent;
        }
        .lang-btn:hover { border-color: #2dd4bf; color: #2dd4bf; }
        .lang-btn.active { background: #2dd4bf; color: #0f172a; border-color: #2dd4bf; }
        .lang-switch {
            display: flex; align-items: center;
            background: #1e293b; border: 1px solid #334155;
            border-radius: 999px; padding: 3px;
            gap: 2px;
        }

        /* ── Project card ── */
        .project-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(45,212,191,0.08);
        }
        .cover-wrapper {
            position: relative; overflow: hidden;
            border-radius: 0.75rem 0.75rem 0 0;
        }
        .cover-wrapper img {
            width: 100%; height: 220px;
            object-fit: cover; transition: transform 0.5s ease;
        }
        .project-card:hover .cover-wrapper img { transform: scale(1.05); }
        .cover-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(15,23,42,0.9) 100%);
        }
        .cover-badge { position: absolute; top: 12px; left: 12px; }

        /* ── Modal ── */
        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(2,6,23,0.88);
            backdrop-filter: blur(8px);
            z-index: 100; display: flex;
            align-items: center; justify-content: center;
            padding: 1rem; opacity: 0;
            pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: all; }
        .modal-box {
            background: #0f172a; border: 1px solid #1e293b;
            border-radius: 1.25rem; max-width: 860px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            transform: scale(0.95) translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 30px 100px rgba(0,0,0,0.6);
        }
        .modal-backdrop.open .modal-box { transform: scale(1) translateY(0); }

        /* ── Gallery ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        .gallery-grid img {
            width: 100%; height: 160px; object-fit: cover;
            border-radius: 8px; cursor: zoom-in;
            transition: transform 0.2s, opacity 0.2s;
            border: 1px solid #1e293b;
        }
        .gallery-grid img:hover { transform: scale(1.03); opacity: 0.85; }

        /* ── Lightbox ── */
        .lightbox {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .lightbox.open { opacity: 1; pointer-events: all; }
        .lb-backdrop {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.93); z-index: 0;
        }
        .lb-img-wrap {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            max-width: 90vw; max-height: 88vh;
        }
        .lb-img-wrap img {
            max-width: 88vw; max-height: 85vh;
            object-fit: contain; border-radius: 10px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .lb-nav {
            position: relative; z-index: 3;
            width: 52px; height: 52px; flex-shrink: 0;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            margin: 0 14px;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            backdrop-filter: blur(6px);
        }
        .lb-nav:hover { background: rgba(45,212,191,0.18); color: #2dd4bf; transform: scale(1.1); }
        .lb-nav:active { transform: scale(0.95); }
        .lb-close {
            position: absolute; top: 18px; right: 22px; z-index: 4;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.7); width: 40px; height: 40px;
            border-radius: 50%; font-size: 22px; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s; backdrop-filter: blur(6px);
        }
        .lb-close:hover { background: rgba(239,68,68,0.25); color: #f87171; }
        .lb-counter {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 4;
            color: rgba(255,255,255,0.5); font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0,0,0,0.4); padding: 4px 14px;
            border-radius: 999px; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08); letter-spacing: 0.05em;
        }

        /* ── Misc ── */
        .tech-badge {
            display: inline-block; background: #1e293b; color: #94a3b8;
            font-size: 11px; padding: 3px 10px; border-radius: 999px;
            border: 1px solid #334155; font-family: 'JetBrains Mono', monospace;
        }
        .hl-dot::before { content: '▸'; color: #2dd4bf; margin-right: 6px; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeup { animation: fadeUp 0.5s ease forwards; }
        .section-heading::after {
            content: ''; display: block; width: 48px; height: 3px;
            background: linear-gradient(90deg, #2dd4bf, transparent);
            border-radius: 2px; margin-top: 10px;
        }

        /* Page transition on lang switch */
        body { transition: opacity 0.15s ease; }
        body.fading { opacity: 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- NAV -->
    <nav class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/60">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-xl font-bold tracking-wider text-teal-400 font-mono">&lt;DEV /&gt;</span>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex space-x-6 text-sm font-medium text-slate-400">
                    <a href="#about"    class="hover:text-teal-400 transition duration-200" data-i18n="nav.about">About</a>
                    <a href="#projects" class="hover:text-teal-400 transition duration-200" data-i18n="nav.projects">Projects</a>
                    <a href="#contact"  class="hover:text-teal-400 transition duration-200" data-i18n="nav.contact">Contact</a>
                </div>
                <!-- Language Switch -->
                <div class="lang-switch" id="lang-switch">
                    <button class="lang-btn" id="btn-id" onclick="setLang('id')">ID</button>
                    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-gradient max-w-5xl mx-auto px-6 pt-28 pb-20 md:py-36 flex flex-col justify-center">
        <p class="text-teal-400 font-mono text-sm mb-3 animate-fadeup" style="animation-delay:0.1s" data-i18n="hero.greeting"></p>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-slate-100 mb-5 animate-fadeup leading-tight" style="animation-delay:0.2s">
            Web Programmer<br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-cyan-300">&amp; GIS Developer.</span>
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mb-10 leading-relaxed animate-fadeup" style="animation-delay:0.3s" data-i18n="hero.desc" data-i18n-html="true"></p>
        <div class="flex flex-wrap gap-4 animate-fadeup" style="animation-delay:0.4s">
            <a href="#projects" class="bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-6 py-3 rounded-lg transition shadow-lg shadow-teal-500/20 flex items-center gap-2">
                <i class="fas fa-folder-open text-sm"></i>
                <span data-i18n="hero.cta_projects"></span>
            </a>
            <a href="#contact" class="border border-slate-700 hover:border-teal-400 hover:text-teal-400 px-6 py-3 rounded-lg transition font-medium text-slate-300" data-i18n="hero.cta_contact"></a>
        </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="max-w-5xl mx-auto px-6 py-20 border-t border-slate-800/40">
        <h2 class="text-2xl font-bold mb-10 flex items-center gap-3 section-heading" data-i18n="about.title"></h2>
        <div class="grid md:grid-cols-3 gap-8">
            <div class="md:col-span-2 text-slate-400 leading-relaxed space-y-4 text-[15px]">
                <p data-i18n="about.p1" data-i18n-html="true"></p>
                <p data-i18n="about.p2" data-i18n-html="true"></p>
                <p data-i18n="about.p3"></p>
                <div class="flex items-center gap-2 pt-2">
                    <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                    <span class="text-teal-400 text-sm font-medium" data-i18n="about.open"></span>
                </div>
            </div>
            <div class="bg-slate-800/30 p-6 rounded-xl border border-slate-800/60">
                <h3 class="text-xs font-semibold uppercase tracking-widest text-teal-400 mb-5 font-mono">Tech Stack</h3>
                <div class="flex flex-wrap gap-2" id="skills-container"></div>
            </div>
        </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="max-w-5xl mx-auto px-6 py-20 border-t border-slate-800/40">
        <h2 class="text-2xl font-bold mb-12 flex items-center gap-3 section-heading" data-i18n="projects.title"></h2>
        <div id="projects-grid" class="grid md:grid-cols-2 gap-6">
            <!-- Filled by JS -->
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="max-w-5xl mx-auto px-6 py-28 text-center border-t border-slate-800/40">
        <p id="contact-tagline" class="text-teal-400 font-mono text-sm mb-2"></p>
        <h2 id="contact-heading" class="text-3xl md:text-4xl font-bold mb-5"></h2>
        <p id="contact-desc" class="text-slate-400 max-w-lg mx-auto mb-10 text-sm leading-relaxed"></p>
        <div id="contact-links" class="flex flex-wrap justify-center gap-4 text-slate-400"></div>
    </section>

    <footer class="py-8 text-center text-xs text-slate-600 border-t border-slate-900 bg-slate-950/60">
        <p>© <span id="year"></span> — <span data-i18n="footer.made"></span></p>
    </footer>

    <!-- MODAL -->
    <div class="modal-backdrop" id="project-modal" role="dialog" aria-modal="true">
        <div class="modal-box" id="modal-box"></div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lb-close" onclick="closeLightbox()">&times;</button>
        <button class="lb-nav" id="lb-prev" onclick="lbNavigate(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="lb-img-wrap" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="Preview">
        </div>
        <button class="lb-nav" id="lb-next" onclick="lbNavigate(1)"><i class="fas fa-chevron-right"></i></button>
        <div class="lb-counter" id="lb-counter"></div>
        <div class="lb-backdrop" onclick="closeLightbox()"></div>
    </div>

    <script>
    // ==============================================
    //  i18n – Translation dictionary
    // ==============================================
    const translations = {
        id: {
            'nav.about':        'Tentang',
            'nav.projects':     'Projek',
            'nav.contact':      'Kontak',
            'hero.greeting':    'Halo, nama saya SUkmana Fatkhurokhman',
            'hero.desc':        'Berpengalaman sejak <strong class="text-slate-300">2017</strong> membangun aplikasi pemerintahan, sistem pajak daerah, dan platform WebGIS berbasis spasial. Spesialis integrasi backend, database geospasial, dan peta interaktif.',
            'hero.cta_projects':'Lihat Projek Saya',
            'hero.cta_contact': 'Hubungi Saya',
            'about.title':      'Tentang Saya',
            'about.p1':         'Saya adalah seorang <strong class="text-slate-200">Web Programmer &amp; GIS Developer</strong> dengan pengalaman lebih dari <strong class="text-teal-400">7 tahun</strong> di industri pengembangan perangkat lunak pemerintahan. Fokus utama saya adalah membangun aplikasi yang scalable, aman, dan benar-benar digunakan oleh instansi resmi.',
            'about.p2':         'Saya memiliki keahlian khusus dalam pengembangan sistem berbasis <strong class="text-slate-200">geospasial (WebGIS)</strong> menggunakan GeoServer, PostGIS, dan peta interaktif berbasis web. Terbiasa menangani data skala besar dan integrasi multi-sistem pada lingkungan server Linux produksi.',
            'about.p3':         'Saya bekerja secara profesional baik mandiri maupun dalam tim, dengan komitmen terhadap kualitas kode yang bersih dan dokumentasi yang baik.',
            'about.open':       'Terbuka untuk peluang kerja Remote / Hybrid',
            'projects.title':   'Projek Yang Pernah Dikerjakan',
            'projects.screenshots': 'screenshot tersedia',
            'modal.features':   'Fitur Utama',
            'modal.tech':       'Teknologi',
            'modal.gallery':    'Screenshot Aplikasi',
            'modal.demo':       'Buka Demo',
            'modal.source':     'Source Code',
            'footer.made':      'Dibuat dengan HTML, CSS &amp; JavaScript.',
        },
        en: {
            'nav.about':        'About',
            'nav.projects':     'Projects',
            'nav.contact':      'Contact',
            'hero.greeting':    'Hi, my name is Sukmana Fatkhurokhman ',
            'hero.desc':        'Experienced since <strong class="text-slate-300">2017</strong> building government applications, regional tax systems, and spatial WebGIS platforms. Specialist in backend integration, geospatial databases, and interactive maps.',
            'hero.cta_projects':'View My Projects',
            'hero.cta_contact': 'Contact Me',
            'about.title':      'About Me',
            'about.p1':         'I am a <strong class="text-slate-200">Web Programmer &amp; GIS Developer</strong> with over <strong class="text-teal-400">7 years</strong> of experience in government software development. My main focus is building scalable, secure applications that are genuinely used by official agencies.',
            'about.p2':         'I have specialized expertise in <strong class="text-slate-200">geospatial (WebGIS)</strong> system development using GeoServer, PostGIS, and web-based interactive maps. Experienced in handling large-scale data and multi-system integrations in Linux production server environments.',
            'about.p3':         'I work professionally both independently and in teams, committed to clean code quality and thorough documentation.',
            'about.open':       'Open to Remote / Hybrid job opportunities',
            'projects.title':   'Projects I Have Worked On',
            'projects.screenshots': 'screenshots available',
            'modal.features':   'Key Features',
            'modal.tech':       'Technology',
            'modal.gallery':    'Application Screenshots',
            'modal.demo':       'Open Demo',
            'modal.source':     'Source Code',
            'footer.made':      'Built with HTML, CSS &amp; JavaScript.',
        }
    };

    let currentLang = localStorage.getItem('lang') || 'id';
    let allProjects  = [];
    let contactData  = null;

    // ==============================================
    //  Apply translations to static elements
    // ==============================================
    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        document.documentElement.lang = lang;

        // Update all data-i18n elements
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key  = el.getAttribute('data-i18n');
            const html = el.getAttribute('data-i18n-html') === 'true';
            const val  = translations[lang][key];
            if (val === undefined) return;
            if (html) el.innerHTML = val;
            else      el.textContent = val;
        });

        // Language button states
        document.getElementById('btn-id').classList.toggle('active', lang === 'id');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');

        // Re-render projects & contact with new language
        if (allProjects.length) renderProjectCards(allProjects);
        if (contactData)        renderContact(contactData);
    }

    function setLang(lang) {
        if (lang === currentLang) return;
        document.body.classList.add('fading');
        setTimeout(() => {
            applyLang(lang);
            document.body.classList.remove('fading');
        }, 150);
    }

    function t(key) { return translations[currentLang][key] || key; }

    // ==============================================
    //  Skills
    // ==============================================
    const skills = [
        'PHP','CodeIgniter','Next.js','AdonisJS','JavaScript',
        'PostgreSQL','PostGIS','MySQL','GeoServer','Leaflet.js',
        'OpenLayers','Linux Server','Ubuntu','REST API','Git'
    ];
    const skillsContainer = document.getElementById('skills-container');
    skills.forEach((s, i) => {
        const span = document.createElement('span');
        span.className = 'tech-badge animate-fadeup';
        span.style.animationDelay = `${0.05 * i}s`;
        span.textContent = s;
        skillsContainer.appendChild(span);
    });

    // ==============================================
    //  Projects
    // ==============================================
    fetch('projects.json')
        .then(r => r.json())
        .then(data => {
            allProjects = data;
            renderProjectCards(data);
        })
        .catch(err => console.error('Failed to load projects.json', err));

    function getLang(field) {
        if (typeof field === 'object' && field !== null) {
            return field[currentLang] || field['id'] || '';
        }
        return field || '';
    }

    function renderProjectCards(projects) {
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = '';
        projects.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'project-card bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden cursor-pointer group';
            card.id = `project-card-${p.id}`;

            const desc        = getLang(p.description);
            const subtitle    = getLang(p.subtitle);
            const category    = getLang(p.category);
            const screenshotTxt = `${p.images.length} ${t('projects.screenshots')}`;

            card.innerHTML = `
                <div class="cover-wrapper">
                    <img src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'">
                    <div class="cover-overlay"></div>
                    <div class="cover-badge">
                        <span class="text-xs font-mono text-teal-300 bg-slate-950/70 border border-teal-500/30 px-2.5 py-1 rounded-full backdrop-blur-sm">${category}</span>
                    </div>
                </div>
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs text-slate-500 font-mono">${p.year}</span>
                        <div class="flex gap-3 text-slate-500">
                            ${p.url    ? `<a href="${p.url}"    target="_blank" onclick="event.stopPropagation()" class="hover:text-teal-400 transition" title="Demo"><i class="fas fa-external-link-alt text-sm"></i></a>` : ''}
                            ${p.github ? `<a href="${p.github}" target="_blank" onclick="event.stopPropagation()" class="hover:text-teal-400 transition" title="GitHub"><i class="fab fa-github text-base"></i></a>` : ''}
                        </div>
                    </div>
                    <h3 class="text-lg font-bold mb-1 group-hover:text-teal-400 transition">${p.title}</h3>
                    <p class="text-slate-500 text-xs mb-3">${subtitle}</p>
                    <p class="text-slate-400 text-sm leading-relaxed line-clamp-3 mb-4">${desc}</p>
                    <div class="flex flex-wrap gap-1.5 pt-3 border-t border-slate-800/60">
                        ${p.tech.slice(0,5).map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
                        ${p.tech.length > 5 ? `<span class="tech-badge text-teal-400/60">+${p.tech.length-5}</span>` : ''}
                    </div>
                    <div class="mt-3 flex items-center gap-1 text-teal-400 text-xs font-medium">
                        <i class="fas fa-images text-xs"></i>
                        <span>${screenshotTxt}</span>
                        <i class="fas fa-arrow-right text-xs ml-1 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => openModal(p));
            grid.appendChild(card);
        });
    }

    // ==============================================
    //  Modal
    // ==============================================
    function openModal(p) {
        const modal = document.getElementById('project-modal');
        const box   = document.getElementById('modal-box');

        const desc       = getLang(p.description);
        const subtitle   = getLang(p.subtitle);
        const category   = getLang(p.category);
        const highlights = getLang(p.highlights);

        box.innerHTML = `
            <div class="relative">
                <div class="relative h-56 overflow-hidden rounded-t-xl">
                    <img src="${p.cover}" alt="${p.title}" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none'">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-slate-950"></div>
                    <button onclick="closeModal()" class="absolute top-3 right-3 text-white/70 hover:text-white bg-black/40 hover:bg-black/60 rounded-full w-9 h-9 flex items-center justify-center transition text-lg backdrop-blur-sm">&times;</button>
                </div>
                <div class="p-6 md:p-8">
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span class="text-xs font-mono text-teal-300 bg-teal-500/10 border border-teal-500/20 px-2.5 py-0.5 rounded-full">${category}</span>
                        <span class="text-xs text-slate-500 font-mono">${p.year}</span>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold mb-1">${p.title}</h2>
                    <p class="text-teal-400/80 text-sm mb-5">${subtitle}</p>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6">${desc}</p>

                    <!-- Highlights -->
                    <div class="mb-6">
                        <h4 class="text-xs font-semibold uppercase tracking-widest text-slate-500 mb-3">${t('modal.features')}</h4>
                        <ul class="space-y-1.5">
                            ${(Array.isArray(highlights) ? highlights : []).map(h => `<li class="text-slate-300 text-sm hl-dot">${h}</li>`).join('')}
                        </ul>
                    </div>

                    <!-- Tech -->
                    <div class="mb-6">
                        <h4 class="text-xs font-semibold uppercase tracking-widest text-slate-500 mb-3">${t('modal.tech')}</h4>
                        <div class="flex flex-wrap gap-2">
                            ${p.tech.map(tech => `<span class="tech-badge">${tech}</span>`).join('')}
                        </div>
                    </div>

                    <!-- Links -->
                    ${(p.url || p.github) ? `
                    <div class="mb-6 flex flex-wrap gap-3">
                        ${p.url ? `<a href="${p.url}" target="_blank" class="inline-flex items-center gap-2 text-sm bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-4 py-2 rounded-lg transition"><i class="fas fa-external-link-alt text-xs"></i> ${t('modal.demo')}</a>` : ''}
                        ${p.credentials ? `<span class="inline-flex items-center gap-1.5 text-xs font-mono text-slate-500 bg-slate-800 px-3 py-2 rounded-lg border border-slate-700"><i class="fas fa-key text-teal-400/60"></i> ${p.credentials}</span>` : ''}
                        ${p.github ? `<a href="${p.github}" target="_blank" class="inline-flex items-center gap-2 text-sm border border-slate-700 hover:border-teal-400 hover:text-teal-400 px-4 py-2 rounded-lg transition text-slate-300"><i class="fab fa-github text-sm"></i> ${t('modal.source')}</a>` : ''}
                    </div>` : ''}

                    <!-- Gallery -->
                    <div>
                        <h4 class="text-xs font-semibold uppercase tracking-widest text-slate-500 mb-3">${t('modal.gallery')}</h4>
                        <div class="gallery-grid">
                            ${p.images.map((img, i) => `
                                <img src="${img}" alt="${p.title} screenshot ${i+1}" loading="lazy"
                                     onclick="openLightbox(${i})"
                                     onerror="this.parentElement.removeChild(this)"
                                     title="Click to enlarge">
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;

        currentGallery = p.images;
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('project-modal').classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('project-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape')     { closeLightbox(); closeModal(); }
        if (e.key === 'ArrowRight') lbNavigate(1);
        if (e.key === 'ArrowLeft')  lbNavigate(-1);
    });

    // ==============================================
    //  Lightbox
    // ==============================================
    let currentGallery = [];
    let lbImages = [];
    let lbIndex  = 0;

    function openLightbox(idx) {
        lbImages = currentGallery.length ? currentGallery : [];
        lbIndex  = typeof idx === 'number' ? idx : 0;
        lbShow();
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function lbShow() {
        const img     = document.getElementById('lightbox-img');
        const counter = document.getElementById('lb-counter');
        const prev    = document.getElementById('lb-prev');
        const next    = document.getElementById('lb-next');
        const src     = lbImages[lbIndex];

        img.style.transition = 'none';
        img.style.opacity    = '0';
        img.style.transform  = 'scale(0.96)';
        setTimeout(() => {
            img.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
            img.src              = src;
            img.style.opacity    = '1';
            img.style.transform  = 'scale(1)';
        }, 130);

        counter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
        const multi = lbImages.length > 1;
        prev.style.opacity       = multi ? '1' : '0.2';
        next.style.opacity       = multi ? '1' : '0.2';
        prev.style.pointerEvents = multi ? 'auto' : 'none';
        next.style.pointerEvents = multi ? 'auto' : 'none';
    }

    function lbNavigate(dir) {
        lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
        lbShow();
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
        lbImages = []; lbIndex = 0;
    }

    // ==============================================
    //  Contact
    // ==============================================
    fetch('contact.json')
        .then(r => r.json())
        .then(c => {
            contactData = c;
            renderContact(c);
        })
        .catch(err => console.error('Failed to load contact.json', err));

    function renderContact(c) {
        const tagline = getLang(c.tagline);
        const heading = getLang(c.heading);
        const desc    = getLang(c.description);

        document.getElementById('contact-tagline').textContent = tagline;
        document.getElementById('contact-heading').textContent = heading;
        document.getElementById('contact-desc').innerHTML = desc
            .replace('Remote (WFH)', '<strong class="text-slate-200">Remote (WFH)</strong>')
            .replace('Hybrid',       '<strong class="text-slate-200">Hybrid</strong>');

        const linksEl = document.getElementById('contact-links');
        linksEl.innerHTML = '';
        c.links.forEach(lnk => {
            const a = document.createElement('a');
            a.href      = lnk.href;
            a.id        = `contact-${lnk.id}`;
            if (lnk.target !== '_self') a.target = lnk.target;
            a.className = 'hover:text-teal-400 transition flex items-center gap-2 text-sm bg-slate-800/60 px-5 py-3 rounded-xl border border-slate-700/60 hover:border-teal-500/40';
            a.innerHTML = `<i class="${lnk.icon}"></i> ${lnk.label}`;
            linksEl.appendChild(a);
        });
    }

    // ==============================================
    //  Init
    // ==============================================
    document.getElementById('year').textContent = new Date().getFullYear();
    applyLang(currentLang);
    </script>
</body>
</html>
